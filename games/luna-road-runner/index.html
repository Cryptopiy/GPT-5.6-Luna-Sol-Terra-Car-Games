<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Luna Game // Road Runner</title>
  <style>
    :root {
      --ink: #f3f7ff;
      --muted: #9aa9c2;
      --cyan: #76f5e3;
      --orange: #ff945d;
      --panel: rgba(9, 16, 31, .84);
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #08101f; }
    body { color: var(--ink); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #game { position: fixed; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    .hud { position: fixed; inset: 0; pointer-events: none; padding: clamp(18px, 3vw, 36px); display: flex; justify-content: space-between; align-items: flex-start; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 12px; font-weight: 800; letter-spacing: .22em; text-transform: uppercase; }
    .brand-mark { width: 30px; height: 30px; border: 1px solid rgba(118,245,227,.8); border-radius: 50%; display: grid; place-items: center; box-shadow: 0 0 20px rgba(118,245,227,.22); }
    .brand-mark::after { content: ""; width: 8px; height: 8px; background: var(--cyan); border-radius: 50%; box-shadow: 0 0 12px var(--cyan); }
    .stats { min-width: 210px; text-align: right; }
    .stat-label { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    .stat-value { margin-top: 2px; font-size: clamp(20px, 3vw, 30px); font-weight: 800; letter-spacing: -.04em; }
    .stat-value span { color: var(--cyan); }
    .progress-wrap { margin-top: 12px; width: min(220px, 32vw); height: 4px; overflow: hidden; background: rgba(255,255,255,.15); border-radius: 4px; }
    #progress { width: 0%; height: 100%; background: linear-gradient(90deg, var(--cyan), #c8fff5); box-shadow: 0 0 12px var(--cyan); transition: width .12s linear; }
    .hint { position: fixed; bottom: 27px; left: 50%; transform: translateX(-50%); color: rgba(243,247,255,.68); font-size: 11px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; white-space: nowrap; pointer-events: none; }
    .key { display: inline-grid; place-items: center; min-width: 24px; height: 22px; margin: 0 3px; border: 1px solid rgba(255,255,255,.3); border-radius: 4px; color: var(--ink); font-size: 11px; }
    .screen { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 50% 45%, rgba(31,57,92,.34), rgba(2,6,16,.78) 72%); transition: opacity .35s, visibility .35s; }
    .screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .panel { width: min(520px, 100%); padding: clamp(28px, 6vw, 56px); border: 1px solid rgba(160,206,236,.22); border-radius: 22px; background: linear-gradient(145deg, rgba(18,33,57,.91), var(--panel)); box-shadow: 0 25px 90px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.08); backdrop-filter: blur(16px); text-align: center; }
    .eyebrow { color: var(--cyan); font-size: 10px; font-weight: 800; letter-spacing: .25em; text-transform: uppercase; }
    h1 { margin: 13px 0 10px; font-size: clamp(44px, 10vw, 78px); line-height: .9; letter-spacing: -.08em; }
    h1 em { display: block; color: var(--orange); font-style: normal; }
    .panel p { max-width: 360px; margin: 20px auto 27px; color: var(--muted); font-size: 14px; line-height: 1.65; }
    .controls { display: flex; justify-content: center; gap: 8px; margin-bottom: 28px; }
    .control { display: flex; align-items: center; gap: 7px; color: #c7d2e4; font-size: 11px; font-weight: 700; letter-spacing: .05em; }
    .key.big { width: 31px; height: 29px; font-size: 14px; }
    button { appearance: none; border: 0; border-radius: 8px; padding: 15px 30px; color: #06161b; background: var(--cyan); box-shadow: 0 0 24px rgba(118,245,227,.22); font: inherit; font-size: 12px; font-weight: 900; letter-spacing: .16em; text-transform: uppercase; cursor: pointer; transition: transform .2s, box-shadow .2s, background .2s; }
    button:hover { transform: translateY(-2px); background: #a4fff2; box-shadow: 0 8px 28px rgba(118,245,227,.34); }
    button:active { transform: translateY(0); }
    .result-icon { display: inline-grid; place-items: center; width: 54px; height: 54px; border: 1px solid var(--orange); border-radius: 50%; color: var(--orange); font-size: 24px; box-shadow: 0 0 28px rgba(255,148,93,.2); }
    .result-icon.win { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 28px rgba(118,245,227,.2); }
    .result-title { margin: 18px 0 8px; font-size: clamp(32px, 7vw, 54px); line-height: 1; letter-spacing: -.07em; }
    .result-copy { margin: 0 auto 26px !important; }
    #touch { position: fixed; z-index: 3; left: 0; right: 0; bottom: 65px; display: none; justify-content: center; gap: 10px; pointer-events: none; }
    .touch-button { width: 58px; height: 48px; border: 1px solid rgba(255,255,255,.24); border-radius: 10px; background: rgba(11,22,39,.58); color: white; font-size: 22px; pointer-events: auto; user-select: none; -webkit-user-select: none; }
    @media (max-width: 700px) { .hud { padding: 18px; } .hint { display: none; } #touch { display: flex; } .stats { min-width: 0; } .stat-label { font-size: 9px; } .stat-value { font-size: 22px; } .progress-wrap { width: 145px; } }
  </style>
</head>
<body>
  <div id="game"></div>
  <div class="hud">
    <div class="brand"><span class="brand-mark"></span><span>Luna // Road Run</span></div>
    <div class="stats">
      <div class="stat-label">Distance / speed</div>
      <div class="stat-value"><span id="distance">000</span> m <small>·</small> <span id="speed">0</span> km/h</div>
      <div class="progress-wrap"><div id="progress"></div></div>
    </div>
  </div>
  <div class="hint"><span class="key">A</span><span class="key">D</span> or <span class="key">←</span><span class="key">→</span> steer</div>
  <div id="touch"><button class="touch-button" data-dir="-1" aria-label="Steer left">‹</button><button class="touch-button" data-dir="1" aria-label="Steer right">›</button></div>

  <section id="startScreen" class="screen">
    <div class="panel">
      <div class="eyebrow">Night drive / Sector 07</div>
      <h1>LUNA<em>GAME</em></h1>
      <p>Keep your line through the neon night. Dodge the traffic, hold your nerve, and reach the finish before the road runs out.</p>
      <div class="controls"><div class="control"><span class="key big">A</span><span class="key big">D</span> steer</div><div class="control"><span class="key big">←</span><span class="key big">→</span> steer</div></div>
      <button id="startButton">Start drive</button>
    </div>
  </section>
  <section id="resultScreen" class="screen hidden">
    <div class="panel">
      <div id="resultIcon" class="result-icon">!</div>
      <h2 id="resultTitle" class="result-title">You crashed!</h2>
      <p id="resultCopy" class="result-copy">The road won this time.</p>
      <button id="retryButton">Retry run</button>
    </div>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    (() => {
      'use strict';

      const scene = new THREE.Scene();
      scene.fog = new THREE.Fog(0x08101f, 55, 260);
      scene.background = new THREE.Color(0x08101f);
      const camera = new THREE.PerspectiveCamera(58, innerWidth / innerHeight, .1, 500);
      camera.position.set(0, 7.2, 17);
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7));
      renderer.setSize(innerWidth, innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputEncoding = THREE.sRGBEncoding;
      document.getElementById('game').appendChild(renderer.domElement);

      const clock = new THREE.Clock();
      const world = new THREE.Group();
      scene.add(world);
      const roadGroup = new THREE.Group();
      const trafficGroup = new THREE.Group();
      const effectsGroup = new THREE.Group();
      world.add(roadGroup, trafficGroup, effectsGroup);
      const mats = {
        road: new THREE.MeshStandardMaterial({ color: 0x202a3a, roughness: .9 }),
        roadEdge: new THREE.MeshStandardMaterial({ color: 0x52627c, roughness: .75 }),
        lane: new THREE.MeshBasicMaterial({ color: 0xc7e3e2 }),
        grass: new THREE.MeshStandardMaterial({ color: 0x102e35, roughness: 1 }),
        barrier: new THREE.MeshStandardMaterial({ color: 0x243d52, roughness: .65, metalness: .35 }),
        cyan: new THREE.MeshStandardMaterial({ color: 0x76f5e3, emissive: 0x1a8b80, emissiveIntensity: 1.8 }),
        orange: new THREE.MeshStandardMaterial({ color: 0xff945d, emissive: 0x77331a, emissiveIntensity: .8 }),
        car: new THREE.MeshStandardMaterial({ color: 0xd9434e, roughness: .28, metalness: .35 }),
        carDark: new THREE.MeshStandardMaterial({ color: 0x212d48, roughness: .28, metalness: .6 }),
        glass: new THREE.MeshStandardMaterial({ color: 0x88d4e2, emissive: 0x123c55, emissiveIntensity: .45, transparent: true, opacity: .8, roughness: .1, metalness: .3 }),
        tire: new THREE.MeshStandardMaterial({ color: 0x090d16, roughness: .95 }),
        white: new THREE.MeshStandardMaterial({ color: 0xf5f3d0, emissive: 0x8c8b52, emissiveIntensity: 1.5 }),
        redLight: new THREE.MeshStandardMaterial({ color: 0xff244f, emissive: 0xb60029, emissiveIntensity: 2 }),
        tree: new THREE.MeshStandardMaterial({ color: 0x1e5352, roughness: 1 })
      };

      scene.add(new THREE.HemisphereLight(0x6b8cb9, 0x070b14, 1.25));
      const sun = new THREE.DirectionalLight(0xb9d8ff, 1.8);
      sun.position.set(-30, 45, 25); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
      sun.shadow.camera.left = -38; sun.shadow.camera.right = 38; sun.shadow.camera.top = 45; sun.shadow.camera.bottom = -25;
      scene.add(sun);
      const cyanLight = new THREE.PointLight(0x55e9e0, 5, 34, 2); cyanLight.position.set(-11, 5, 10); scene.add(cyanLight);
      const orangeLight = new THREE.PointLight(0xff7245, 3, 28, 2); orangeLight.position.set(11, 4, -26); scene.add(orangeLight);

      function mesh(geometry, material, parent, x = 0, y = 0, z = 0) {
        const item = new THREE.Mesh(geometry, material); item.position.set(x, y, z); item.castShadow = true; item.receiveShadow = true; parent.add(item); return item;
      }
      function createRoad() {
        const segmentLength = 52;
        for (let i = 0; i < 7; i++) {
          const segment = new THREE.Group(); segment.position.z = -i * segmentLength;
          mesh(new THREE.BoxGeometry(24, .18, segmentLength + .5), mats.grass, segment, 0, -.22, 0);
          mesh(new THREE.BoxGeometry(13.5, .12, segmentLength), mats.road, segment, 0, -.08, 0);
          mesh(new THREE.BoxGeometry(.16, .13, segmentLength), mats.roadEdge, segment, -6.72, .03, 0);
          mesh(new THREE.BoxGeometry(.16, .13, segmentLength), mats.roadEdge, segment, 6.72, .03, 0);
          for (const x of [-2.25, 2.25]) for (let j = 0; j < 6; j++) mesh(new THREE.BoxGeometry(.1, .025, 4.1), mats.lane, segment, x, .01, -22 + j * 9);
          for (const x of [-9.2, 9.2]) {
            mesh(new THREE.BoxGeometry(.34, .85, segmentLength), mats.barrier, segment, x, .25, 0);
            for (let j = 0; j < 5; j++) mesh(new THREE.BoxGeometry(.39, .1, 3.5), j % 2 ? mats.orange : mats.cyan, segment, x, .78, -20 + j * 11);
          }
          // Sparse roadside geometry gives the repeating road a sense of scale.
          for (const x of [-15, 15]) {
            const trunk = mesh(new THREE.CylinderGeometry(.16, .23, 2.2, 7), mats.tree, segment, x + (i % 2 ? 1 : -1), .9, (i % 3 - 1) * 12);
            mesh(new THREE.ConeGeometry(1.35, 3.7, 7), mats.tree, segment, trunk.position.x, 3.75, trunk.position.z);
          }
          roadGroup.add(segment);
        }
        return segmentLength;
      }
      const segmentLength = createRoad();

      function createCar() {
        const car = new THREE.Group(); car.position.set(0, .35, 6); car.rotation.order = 'YXZ'; scene.add(car);
        mesh(new THREE.BoxGeometry(2.05, .56, 3.75), mats.car, car, 0, .55, 0);
        mesh(new THREE.BoxGeometry(1.58, .62, 1.78), mats.carDark, car, 0, 1.04, -.25);
        mesh(new THREE.BoxGeometry(1.38, .4, .76), mats.glass, car, 0, 1.1, -.7);
        mesh(new THREE.BoxGeometry(1.38, .35, .52), mats.glass, car, 0, 1.1, .22);
        mesh(new THREE.BoxGeometry(1.8, .1, .16), mats.orange, car, 0, .77, -1.86);
        mesh(new THREE.BoxGeometry(.28, .14, .12), mats.white, car, -.65, .74, -1.91);
        mesh(new THREE.BoxGeometry(.28, .14, .12), mats.white, car, .65, .74, -1.91);
        mesh(new THREE.BoxGeometry(.28, .15, .12), mats.redLight, car, -.65, .74, 1.91);
        mesh(new THREE.BoxGeometry(.28, .15, .12), mats.redLight, car, .65, .74, 1.91);
        const wheels = [];
        for (const x of [-1.07, 1.07]) for (const z of [-1.18, 1.2]) {
          const wheel = mesh(new THREE.CylinderGeometry(.42, .42, .25, 16), mats.tire, car, x, .4, z);
          wheel.rotation.z = Math.PI / 2; wheels.push(wheel);
          mesh(new THREE.CylinderGeometry(.18, .18, .27, 12), mats.roadEdge, car, x, .4, z).rotation.z = Math.PI / 2;
        }
        return { group: car, wheels };
      }
      const player = createCar();
      const car = player.group;
      const lanes = [-4.5, 0, 4.5];

      function createObstacle(type, lane, z, index) {
        const group = new THREE.Group(); group.position.set(lanes[lane], 0, z); group.userData = { type, lane, startZ: z, hit: false, halfX: type === 'car' ? 1.0 : .78, halfZ: type === 'car' ? 1.65 : .7, height: type === 'barrel' ? 1.1 : 1.5 };
        if (type === 'barrel') {
          mesh(new THREE.CylinderGeometry(.68, .68, 1.25, 12), index % 2 ? mats.orange : mats.cyan, group, 0, .65, 0).rotation.z = Math.PI / 2;
          for (const y of [.35, .95]) mesh(new THREE.TorusGeometry(.57, .06, 6, 12), mats.carDark, group, 0, y, 0).rotation.x = Math.PI / 2;
        } else if (type === 'block') {
          mesh(new THREE.BoxGeometry(1.55, 1.6, 1.35), index % 2 ? mats.orange : mats.cyan, group, 0, .8, 0);
          mesh(new THREE.BoxGeometry(1.62, .12, 1.42), mats.white, group, 0, 1.12, 0);
        } else {
          mesh(new THREE.BoxGeometry(1.9, .62, 3.25), mats.carDark, group, 0, .55, 0);
          mesh(new THREE.BoxGeometry(1.45, .58, 1.45), index % 2 ? mats.orange : mats.cyan, group, 0, 1.02, -.15);
          for (const x of [-.65, .65]) { mesh(new THREE.BoxGeometry(.23, .13, .12), mats.redLight, group, x, .73, 1.65); mesh(new THREE.BoxGeometry(.23, .13, .12), mats.white, group, x, .73, -1.65); }
          for (const x of [-.95, .95]) for (const zz of [-1.05, 1.05]) { const w = mesh(new THREE.CylinderGeometry(.35, .35, .22, 12), mats.tire, group, x, .38, zz); w.rotation.z = Math.PI / 2; }
        }
        trafficGroup.add(group); return group;
      }
      const obstacles = [];
      function buildTraffic() {
        // Later rows use paired obstacles, increasing pressure while retaining a lane to escape through.
        const patterns = [[0], [2], [1], [0], [2], [1], [0, 1], [2], [1], [0, 2], [1], [2], [0], [1, 2], [0], [2], [0, 1], [1], [0, 2], [2], [1], [0, 1], [2], [0], [1, 2], [0, 2], [1], [0, 1], [2], [0, 1]];
        patterns.forEach((row, i) => row.forEach((lane, n) => obstacles.push(createObstacle(i % 4 === 0 ? 'barrel' : (i % 3 === 0 ? 'block' : 'car'), lane, -72 - i * 43 - n * 1.8, i + n))));
      }
      buildTraffic();

      function createFinish() {
        const finish = new THREE.Group(); finish.position.set(0, 0, -1405);
        mesh(new THREE.BoxGeometry(14, .07, 3), mats.white, finish, 0, .11, 0);
        for (let x = -6.5; x <= 6.5; x += 1.6) mesh(new THREE.BoxGeometry(.8, .09, 3.05), Math.round(x) % 3 === 0 ? mats.carDark : mats.orange, finish, x, .16, 0);
        mesh(new THREE.BoxGeometry(.5, 6.8, .5), mats.cyan, finish, -7, 3.3, 0); mesh(new THREE.BoxGeometry(.5, 6.8, .5), mats.orange, finish, 7, 3.3, 0);
        mesh(new THREE.BoxGeometry(14.5, .5, .5), mats.cyan, finish, 0, 6.55, 0);
        mesh(new THREE.BoxGeometry(13.2, .85, .12), mats.white, finish, 0, 5.75, 0);
        for (let i = -5; i <= 5; i++) mesh(new THREE.BoxGeometry(1.05, .5, .16), i % 2 ? mats.carDark : mats.orange, finish, i * 1.2, 5.75, -.08);
        world.add(finish); return finish;
      }
      const finish = createFinish();
      const LEVEL_LENGTH = 1400;
      const state = { mode: 'start', distance: 0, speed: 31, targetX: 0, velocityX: 0, startTime: 0, elapsed: 0 };
      const keys = { left: false, right: false };
      const particles = [];
      let flash = null, flashLight = null;
      const $ = id => document.getElementById(id);

      function resetWorld() {
        state.distance = 0; state.speed = 31; state.targetX = 0; state.velocityX = 0; state.elapsed = 0; state.startTime = performance.now();
        car.position.x = 0; car.rotation.set(0, 0, 0); car.visible = true;
        finish.position.z = -LEVEL_LENGTH;
        obstacles.forEach(item => { item.position.z = item.userData.startZ; item.userData.hit = false; item.visible = true; });
        roadGroup.children.forEach((segment, i) => segment.position.z = -i * segmentLength);
        particles.splice(0).forEach(p => effectsGroup.remove(p.mesh));
        if (flash) { effectsGroup.remove(flash); flash = null; } if (flashLight) { scene.remove(flashLight); flashLight = null; }
        updateHud();
      }
      function setScreen(showStart, showResult) { $('startScreen').classList.toggle('hidden', !showStart); $('resultScreen').classList.toggle('hidden', !showResult); }
      function startGame() { resetWorld(); state.mode = 'playing'; setScreen(false, false); clock.start(); }
      function finishGame(won) {
        state.mode = won ? 'won' : 'crashed';
        $('resultIcon').textContent = won ? '✓' : '!'; $('resultIcon').classList.toggle('win', won);
        $('resultTitle').textContent = won ? 'Level complete!' : 'You crashed!';
        $('resultCopy').textContent = won ? `Clean run. Your time: ${state.elapsed.toFixed(2)} seconds.` : `You covered ${Math.floor(state.distance)} meters. The road won this time.`;
        $('retryButton').textContent = won ? 'Play again' : 'Retry run'; setScreen(false, true);
        if (!won) explode();
      }
      function explode() {
        car.visible = false;
        flash = mesh(new THREE.SphereGeometry(.65, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffdd8a, transparent: true, opacity: .9 }), effectsGroup, car.position.x, 1.2, car.position.z);
        flashLight = new THREE.PointLight(0xff713d, 13, 28, 2); flashLight.position.copy(flash.position); scene.add(flashLight);
        for (let i = 0; i < 34; i++) {
          const material = new THREE.MeshBasicMaterial({ color: i % 3 ? (i % 2 ? 0xff945d : 0xffe28c) : 0x76f5e3, transparent: true, opacity: 1 });
          const p = mesh(i % 2 ? new THREE.BoxGeometry(.16, .16, .16) : new THREE.SphereGeometry(.12, 6, 6), material, effectsGroup, car.position.x, 1.15, car.position.z);
          p.userData = { velocity: new THREE.Vector3((Math.random() - .5) * 10, Math.random() * 8 + 2, (Math.random() - .5) * 10), life: 1 + Math.random() * .7, spin: (Math.random() - .5) * 12 };
          particles.push({ mesh: p });
        }
      }
      function updateExplosion(dt) {
        particles.forEach(item => { const p = item.mesh; p.userData.life -= dt; p.userData.velocity.y -= 13 * dt; p.position.addScaledVector(p.userData.velocity, dt); p.rotation.x += p.userData.spin * dt; p.rotation.z += p.userData.spin * dt; p.material.opacity = Math.max(0, p.userData.life); });
        for (let i = particles.length - 1; i >= 0; i--) if (particles[i].mesh.userData.life <= 0) { effectsGroup.remove(particles[i].mesh); particles.splice(i, 1); }
        if (flash) { flash.scale.multiplyScalar(1 + dt * 5); flash.material.opacity = Math.max(0, flash.material.opacity - dt * 2.4); if (flash.material.opacity <= 0) { effectsGroup.remove(flash); flash = null; } }
        if (flashLight) { flashLight.intensity = Math.max(0, flashLight.intensity - dt * 28); if (flashLight.intensity === 0) { scene.remove(flashLight); flashLight = null; } }
      }
      function updateHud() { $('distance').textContent = String(Math.floor(state.distance)).padStart(3, '0'); $('speed').textContent = state.mode === 'playing' ? Math.round(state.speed * 3.6) : 0; $('progress').style.width = `${Math.min(100, state.distance / LEVEL_LENGTH * 100)}%`; }
      function updateRoad() {
        roadGroup.children.forEach(segment => { if (segment.position.z > 48) segment.position.z -= 7 * segmentLength; });
      }
      function updatePlayer(dt) {
        const steer = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
        state.velocityX += (steer * 18 - state.velocityX * 7) * dt;
        state.targetX += state.velocityX * dt; state.targetX = THREE.MathUtils.clamp(state.targetX, -4.65, 4.65);
        car.position.x += (state.targetX - car.position.x) * Math.min(1, dt * 11);
        car.rotation.z += (-state.velocityX * .032 - car.rotation.z) * Math.min(1, dt * 8);
        player.wheels.forEach(wheel => wheel.rotation.x -= state.speed * dt * 1.8);
      }
      function updateTraffic(dt) {
        const movement = state.speed * dt;
        obstacles.forEach(item => {
          item.position.z += movement;
          if (item.position.z > 22) item.visible = false;
          if (!item.userData.hit && item.visible && Math.abs(item.position.z - car.position.z) < item.userData.halfZ + 1.62 && Math.abs(item.position.x - car.position.x) < item.userData.halfX + .9) {
            item.userData.hit = true; finishGame(false);
          }
        });
        finish.position.z += movement;
        if (finish.position.z >= car.position.z) { state.distance = LEVEL_LENGTH; updateHud(); finishGame(true); }
      }
      function updateCamera(dt) {
        const sway = Math.sin(state.distance * .035) * .07;
        const desiredX = car.position.x * .72; camera.position.x += (desiredX - camera.position.x) * Math.min(1, dt * 4.5);
        camera.position.y += (7.2 + sway - camera.position.y) * Math.min(1, dt * 3.5);
        camera.position.z += (17 - camera.position.z) * Math.min(1, dt * 3.5);
        camera.lookAt(car.position.x * .34, .65, -20);
      }
      function frame() {
        const dt = Math.min(clock.getDelta(), .05);
        if (state.mode === 'playing') {
          state.elapsed = (performance.now() - state.startTime) / 1000; state.distance += state.speed * dt; state.speed = Math.min(55, 31 + state.distance * .012);
          updatePlayer(dt); updateTraffic(dt); updateRoad(); updateHud();
        } else if (state.mode === 'crashed') updateExplosion(dt);
        updateCamera(dt); renderer.render(scene, camera); requestAnimationFrame(frame);
      }
      function setKey(code, value) { if (code === 'ArrowLeft' || code === 'KeyA') keys.left = value; if (code === 'ArrowRight' || code === 'KeyD') keys.right = value; }
      addEventListener('keydown', e => { if (['ArrowLeft', 'ArrowRight', 'KeyA', 'KeyD'].includes(e.code)) { e.preventDefault(); setKey(e.code, true); } });
      addEventListener('keyup', e => setKey(e.code, false));
      document.querySelectorAll('.touch-button').forEach(button => { const dir = Number(button.dataset.dir); const on = e => { e.preventDefault(); if (dir < 0) keys.left = true; else keys.right = true; }; const off = e => { e.preventDefault(); if (dir < 0) keys.left = false; else keys.right = false; }; button.addEventListener('pointerdown', on); button.addEventListener('pointerup', off); button.addEventListener('pointercancel', off); button.addEventListener('pointerleave', off); });
      $('startButton').addEventListener('click', startGame); $('retryButton').addEventListener('click', startGame);
      addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 1.7)); });
      resetWorld(); frame();
    })();
  </script>
</body>
</html>
